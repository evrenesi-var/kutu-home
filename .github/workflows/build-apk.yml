name: Build Kutu Home APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare project
        run: |
          echo "Repo contents:"
          find . -maxdepth 2 -type f

          PROJECT_FILE=$(find . -name "settings.gradle.kts" -type f | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            ZIP_FILE=$(find . -name "*.zip" -type f | head -n 1)

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: Proje dosyası veya ZIP bulunamadı."
              exit 1
            fi

            echo "ZIP found: $ZIP_FILE"

            mkdir extracted
            unzip -o "$ZIP_FILE" -d extracted

            PROJECT_FILE=$(find extracted -name "settings.gradle.kts" -type f | head -n 1)
          fi

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: settings.gradle.kts bulunamadı."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "Project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build Kutu Home
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kutu-Home-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
